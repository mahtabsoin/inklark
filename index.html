<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5147aa" />
    <meta
      name="description"
      content="Fill PDFs and approve signatures locally. Free, with tools for your agents."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Inklark</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <input
      id="file-input"
      type="file"
      accept="application/pdf,.pdf,.fillsign.json,.json"
      hidden
    />
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
